name: Deploy ClinMax API (VPS)

# Repositório: back-projeto-clinica (ClinicHub / ClinMax)
# Secrets (Environment Production): SSH_PRIVATE_KEY, HOST, USERNAME, PORT
# Variables: DOTENV_FILE (conteúdo do .env de produção)
#
# CONTRATO OBRIGATÓRIO — NÃO "SIMPLIFICAR":
# - Node permanente via nvm (NODE_VERSION abaixo). PROIBIDO fnm / caminhos temporários.
# - Se pm2-*.service ainda aponta para fnm, o deploy MIGRA para nvm (unstartup+startup) e só aborta se persistir.
# - PM2 com interpreter = resolvePermanentNvmNode() + env_file .env (ver deploy/ecosystem.config.cjs).
# - Healthcheck exige /api/health=200 E /api/ready com db:true. 404 em "/" NÃO é sucesso.
# - Job verify (test+build) antes do deploy. validate-pm2-registration após startOrReload.
# Regressão a376cee (ago/2026) derrubou a API em produção ao remover isso.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch ou SHA para deploy
        required: false
        type: string
        default: main

concurrency:
  group: deploy-clinmax-api
  cancel-in-progress: true

env:
  DEPLOY_TMP: /tmp/clinmax-api-deploy
  VPS_APP_DIR: ~/clinmax-api
  NGINX_SITE: clinmax-api
  NODE_VERSION: "24.15.0"
  CLINMAX_PORT: "3550"
  SSH_PORT: ${{ secrets.PORT || '22' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Validar build compilado
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Validar secrets
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.USERNAME }}
        run: |
          test -n "$SSH_HOST" || (echo "Secret HOST ausente" && exit 1)
          test -n "$SSH_USER" || (echo "Secret USERNAME ausente" && exit 1)

      - name: Materializar .env de produção
        env:
          DOTENV_FILE: ${{ vars.DOTENV_FILE }}
        run: |
          test -n "$DOTENV_FILE" || (echo "Variable DOTENV_FILE ausente" && exit 1)
          printf '%s\n' "$DOTENV_FILE" > .env.deploy
          tr -d '\r' < .env.deploy > .env.deploy.tmp && mv .env.deploy.tmp .env.deploy
          grep -q '^DATABASE_URL=' .env.deploy
          grep -q '^JWT_SECRET=' .env.deploy
          grep -q '^PORT=' .env.deploy

      - name: Compactar código
        run: git archive --format=tar.gz --output=repo.tar.gz HEAD

      - name: Enviar para VPS
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/deploy_key -p ${{ env.SSH_PORT }} \
              ${{ secrets.USERNAME }}@${{ secrets.HOST }} "mkdir -p ${{ env.DEPLOY_TMP }} ${{ env.VPS_APP_DIR }}"
            scp -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/deploy_key -P ${{ env.SSH_PORT }} \
              repo.tar.gz ${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ env.DEPLOY_TMP }}/
            scp -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/deploy_key -P ${{ env.SSH_PORT }} \
              .env.deploy deploy/nginx-api.conf deploy/ecosystem.config.cjs deploy/docker-compose.prod.yml \
              ${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ env.DEPLOY_TMP }}/

      - name: Instalar dependências, migrar DB e reiniciar API
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 45
          command: |
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/deploy_key -p ${{ env.SSH_PORT }} \
              ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
              "NODE_VERSION='${{ env.NODE_VERSION }}' CLINMAX_PORT='${{ env.CLINMAX_PORT }}' \
              DEPLOY_TMP='${{ env.DEPLOY_TMP }}' NGINX_SITE='${{ env.NGINX_SITE }}' bash -s" <<'CLINMAX_DEPLOY'
            set -eo pipefail

            APP_DIR="${VPS_APP_DIR:-${HOME}/clinmax-api}"
            TMP="${DEPLOY_TMP:-/tmp/clinmax-api-deploy}"
            NODE_VERSION="${NODE_VERSION:?NODE_VERSION nao informado}"
            EXPECTED_APP_PORT="${CLINMAX_PORT:-3550}"
            SITE="${NGINX_SITE:-clinmax-api}"
            NVM_DIR="${HOME}/.nvm"
            export NVM_DIR

            for artifact in repo.tar.gz .env.deploy nginx-api.conf ecosystem.config.cjs docker-compose.prod.yml; do
              if [ ! -s "${TMP}/${artifact}" ]; then
                echo "Artefato de deploy ausente: ${TMP}/${artifact}"
                exit 1
              fi
            done

            if [ ! -s "${NVM_DIR}/nvm.sh" ]; then
              echo "nvm nao encontrado na VPS. Siga deploy/README.md antes de publicar."
              exit 1
            fi

            . "${NVM_DIR}/nvm.sh"
            if ! nvm use "${NODE_VERSION}" >/dev/null; then
              echo "Node ${NODE_VERSION} nao esta instalado no nvm. Siga deploy/README.md."
              exit 1
            fi

            NODE_BIN="$(node -p 'process.execPath')"
            ACTIVE_NODE_VERSION="$("${NODE_BIN}" -p 'process.versions.node')"
            if [ "${ACTIVE_NODE_VERSION}" != "${NODE_VERSION}" ]; then
              echo "Versao incorreta do Node. Esperada ${NODE_VERSION}, recebida ${ACTIVE_NODE_VERSION}."
              exit 1
            fi

            case "${NODE_BIN}" in
              "${HOME}"/.nvm/versions/node/*/bin/node) ;;
              *)
                echo "Node temporario ou fora do nvm: ${NODE_BIN}"
                exit 1
                ;;
            esac

            NODE_BIN_DIR="$(dirname "${NODE_BIN}")"
            NVM_NODE_PREFIX="$(dirname "${NODE_BIN_DIR}")"
            NPM_BIN="${NODE_BIN_DIR}/npm"
            NPX_BIN="${NODE_BIN_DIR}/npx"

            if [ ! -x "${NPM_BIN}" ] || [ ! -x "${NPX_BIN}" ]; then
              echo "npm ou npx nao encontrado junto ao Node permanente: ${NODE_BIN_DIR}"
              exit 1
            fi

            PM2_CLI="$("${NPM_BIN}" root -g)/pm2/bin/pm2"
            EXPECTED_PM2_CLI="${NVM_NODE_PREFIX}/lib/node_modules/pm2/bin/pm2"
            case "${PM2_CLI}" in
              "${NVM_NODE_PREFIX}"/lib/node_modules/pm2/bin/pm2) ;;
              *)
                echo "PM2 permanente nao encontrado no Node do nvm."
                echo "Node: ${NODE_BIN}"
                echo "PM2 encontrado: ${PM2_CLI}"
                echo "PM2 esperado: ${EXPECTED_PM2_CLI}"
                echo "Siga deploy/README.md."
                exit 1
                ;;
            esac
            if [ ! -f "${PM2_CLI}" ]; then
              echo "PM2 permanente nao encontrado em ${EXPECTED_PM2_CLI}. Siga deploy/README.md."
              exit 1
            fi

            run_pm2() {
              "${NODE_BIN}" "${PM2_CLI}" "$@"
            }

            # Regenera a unit systemd com o Node permanente do nvm (nunca fnm).
            migrate_pm2_systemd_to_nvm() {
              echo "Migrando ${PM2_SERVICE} para Node permanente do nvm (${NODE_BIN})..."
              run_pm2 save || true
              run_pm2 unstartup systemd || true
              STARTUP_OUT="$(run_pm2 startup systemd -u "$(id -un)" --hp "${HOME}" 2>&1 || true)"
              printf '%s\n' "${STARTUP_OUT}"
              STARTUP_CMD="$(printf '%s\n' "${STARTUP_OUT}" | grep -E '^(sudo |env PATH=)' | tail -n 1 || true)"
              if [ -n "${STARTUP_CMD}" ]; then
                echo "Executando comando de startup do PM2..."
                eval "${STARTUP_CMD}"
              fi
              systemctl daemon-reload
              systemctl enable "${PM2_SERVICE}"
              systemctl restart "${PM2_SERVICE}"
              sleep 2
            }

            PM2_SERVICE="pm2-$(id -un).service"
            PM2_SERVICE_FILE="${TMP}/${PM2_SERVICE}.txt"
            NEED_PM2_MIGRATE=0
            if ! systemctl cat "${PM2_SERVICE}" > "${PM2_SERVICE_FILE}" 2>/dev/null; then
              echo "Servico ${PM2_SERVICE} nao encontrado — gerando com nvm permanente."
              NEED_PM2_MIGRATE=1
            else
              if grep -Eq 'fnm_multishells|/run/user/|/\.fnm/|/\.local/share/fnm' "${PM2_SERVICE_FILE}"; then
                echo "Servico ${PM2_SERVICE} ainda aponta para o fnm — migrando automaticamente."
                NEED_PM2_MIGRATE=1
              elif ! grep -Fq "${NVM_NODE_PREFIX}" "${PM2_SERVICE_FILE}"; then
                echo "Servico ${PM2_SERVICE} nao aponta para o Node permanente do nvm: ${NVM_NODE_PREFIX}"
                echo "Migrando automaticamente."
                NEED_PM2_MIGRATE=1
              fi
            fi

            if [ "${NEED_PM2_MIGRATE}" -eq 1 ]; then
              migrate_pm2_systemd_to_nvm
              if ! systemctl cat "${PM2_SERVICE}" > "${PM2_SERVICE_FILE}" 2>/dev/null; then
                echo "Falha: ${PM2_SERVICE} continua ausente apos migracao. Siga deploy/README.md."
                exit 1
              fi
            fi

            if grep -Eq 'fnm_multishells|/run/user/|/\.fnm/|/\.local/share/fnm' "${PM2_SERVICE_FILE}"; then
              echo "Falha: ${PM2_SERVICE} ainda aponta para o fnm apos migracao."
              systemctl cat "${PM2_SERVICE}" || true
              exit 1
            fi
            if ! grep -Fq "${NVM_NODE_PREFIX}" "${PM2_SERVICE_FILE}"; then
              echo "Falha: ${PM2_SERVICE} nao aponta para o Node permanente do nvm: ${NVM_NODE_PREFIX}"
              systemctl cat "${PM2_SERVICE}" || true
              exit 1
            fi
            if ! systemctl is-enabled --quiet "${PM2_SERVICE}"; then
              echo "Servico ${PM2_SERVICE} nao esta habilitado no boot."
              exit 1
            fi
            if ! systemctl is-active --quiet "${PM2_SERVICE}"; then
              echo "Servico ${PM2_SERVICE} nao esta ativo — tentando restart."
              systemctl restart "${PM2_SERVICE}" || true
              sleep 2
              if ! systemctl is-active --quiet "${PM2_SERVICE}"; then
                echo "Servico ${PM2_SERVICE} continua inativo."
                systemctl status "${PM2_SERVICE}" --no-pager || true
                exit 1
              fi
            fi

            set -a
            . "${TMP}/.env.deploy"
            set +a

            APP_PORT="${PORT:-}"
            if [ "${APP_PORT}" != "${EXPECTED_APP_PORT}" ]; then
              echo "PORT precisa ser ${EXPECTED_APP_PORT} para corresponder ao Nginx. Recebida: ${APP_PORT:-vazia}."
              exit 1
            fi
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "DATABASE_URL de producao esta vazia."
              exit 1
            fi
            if echo "${DATABASE_URL}" | grep -Eq '^file:'; then
              echo "DATABASE_URL de producao aponta para SQLite (file:...)."
              echo "Ajuste DOTENV_FILE no GitHub Environment Production para Postgres (127.0.0.1:5433)."
              exit 1
            fi

            rm -rf "${APP_DIR}"/*
            tar -xzf "${TMP}/repo.tar.gz" -C "${APP_DIR}"
            cp "${TMP}/.env.deploy" "${APP_DIR}/.env"
            cp "${TMP}/nginx-api.conf" "${APP_DIR}/deploy/nginx-api.conf"
            cp "${TMP}/ecosystem.config.cjs" "${APP_DIR}/deploy/ecosystem.config.cjs"
            cp "${TMP}/docker-compose.prod.yml" "${APP_DIR}/deploy/docker-compose.prod.yml"
            cd "${APP_DIR}"

            if command -v docker >/dev/null 2>&1; then
              if docker ps -a --format '{{.Names}}' | grep -qx clinmax_postgres; then
                docker start clinmax_postgres 2>/dev/null || true
              else
                docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d ||
                  echo "Aviso: postgres docker nao subiu. Confira DATABASE_URL no .env."
              fi
            fi

            "${NODE_BIN}" -v
            NODE_ENV=development "${NPM_BIN}" ci --include=dev
            "${NPM_BIN}" run build
            "${NPX_BIN}" prisma generate
            "${NPX_BIN}" prisma migrate deploy || "${NPX_BIN}" prisma db push
            "${NPM_BIN}" run db:seed || true
            "${NPM_BIN}" prune --omit=dev

            export NODE_ENV=production
            export CLINMAX_NODE_BIN="${NODE_BIN}"
            export CLINMAX_API_DIR="${APP_DIR}"
            export NO_COLOR=1

            if ! sudo grep -q 'listen.*443' "/etc/nginx/sites-available/${SITE}" 2>/dev/null; then
              sudo cp deploy/nginx-api.conf "/etc/nginx/sites-available/${SITE}"
              sudo ln -sf "/etc/nginx/sites-available/${SITE}" "/etc/nginx/sites-enabled/${SITE}"
              echo "Nginx ${SITE} instalado em HTTP. Rode certbot --nginx -d api.clinmax.com.br."
            else
              echo "Nginx ${SITE} ja tem SSL 443. Configuracao existente mantida."
            fi
            sudo nginx -t
            sudo systemctl reload nginx

            show_diagnostics() {
              curl -s -i "http://127.0.0.1:${APP_PORT}/api/health" || true
              curl -s -i "http://127.0.0.1:${APP_PORT}/api/ready" || true
              ss -tlnp | grep ":${APP_PORT}" || true
              run_pm2 describe clinmax-api || true
              run_pm2 logs clinmax-api --lines 80 --nostream || true
            }

            run_pm2 startOrReload deploy/ecosystem.config.cjs --update-env
            run_pm2 reset clinmax-api

            HEALTH_FILE="${TMP}/clinmax-health.json"
            READY_FILE="${TMP}/clinmax-ready.json"
            ok=0
            for _attempt in $(seq 1 30); do
              code_health="$(curl -sS -o "${HEALTH_FILE}" -w '%{http_code}' \
                "http://127.0.0.1:${APP_PORT}/api/health" || true)"
              code_ready="$(curl -sS -o "${READY_FILE}" -w '%{http_code}' \
                "http://127.0.0.1:${APP_PORT}/api/ready" || true)"

              if [ "${code_health}" = "200" ] &&
                [ "${code_ready}" = "200" ] &&
                grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "${HEALTH_FILE}" &&
                grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"' "${READY_FILE}" &&
                grep -Eq '"db"[[:space:]]*:[[:space:]]*true' "${READY_FILE}"; then
                ok=1
                break
              fi
              sleep 2
            done

            if [ "${ok}" -ne 1 ]; then
              echo "Healthcheck ou readiness falhou na porta ${APP_PORT}."
              echo "Health HTTP: ${code_health:-n/a}"
              echo "Ready HTTP: ${code_ready:-n/a}"
              show_diagnostics
              exit 1
            fi

            sleep 5
            run_pm2 jlist > "${TMP}/pm2-runtime.json"
            if ! "${NODE_BIN}" scripts/validate-pm2-registration.cjs \
              "${TMP}/pm2-runtime.json" "${NODE_BIN}" "${APP_DIR}" runtime; then
              show_diagnostics
              exit 1
            fi

            run_pm2 save
            PM2_DUMP="${PM2_HOME:-${HOME}/.pm2}/dump.pm2"
            if [ ! -s "${PM2_DUMP}" ]; then
              echo "Dump do PM2 nao foi criado em ${PM2_DUMP}."
              exit 1
            fi
            "${NODE_BIN}" scripts/validate-pm2-registration.cjs \
              "${PM2_DUMP}" "${NODE_BIN}" "${APP_DIR}" saved

            rm -rf "${TMP}"
            echo "ClinMax API deploy OK"
            CLINMAX_DEPLOY
